name: Deploy Dev (ECS + API GW via Terraform)

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-dev.yml'
      - 'infrastructure/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: journalai-dev-backend
  PROJECT: journalai
  ENVIRONMENT: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Build and push Docker image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names $ECR_REPO 2>/dev/null || \
            aws ecr create-repository --repository-name $ECR_REPO --image-scanning-configuration scanOnPush=true
          
          # Build and push image
          docker build -f Dockerfile -t $REGISTRY/$ECR_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_REPO:dev-latest .
          docker push $REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO:dev-latest
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      
      - name: Terraform Deploy
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: dev-latest
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
          TF_VAR_use_existing_namespace: true
          TF_INPUT: "false"
        run: |
          # Initialize Terraform with backend config
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.TF_BACKEND_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"
          
          # Format check
          terraform fmt -check || true
          
          # Validate configuration
          terraform validate
          
          # Plan and apply
          terraform plan -out=tfplan
          terraform apply tfplan
      
      - name: Verify Deployment
        run: |
          # Get API URL from Terraform output
          cd infrastructure/terraform
          API_URL=$(terraform output -raw api_gateway_invoke_url)
          
          # Health check with retries
          echo "Checking $API_URL/health"
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1