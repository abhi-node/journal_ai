name: Deploy Dev - Terraform Infrastructure & ECS

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-dev.yml'
      - 'infrastructure/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT: journalai
  ENVIRONMENT: dev

jobs:
  # TEMPORARY: Remove this job after first successful run
  destroy-all:
    name: Destroy Existing Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Force Delete All Resources
        run: |
          set +e  # Continue on errors
          echo "========================================"
          echo "DESTROYING ALL EXISTING INFRASTRUCTURE"
          echo "========================================"
          
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          
          # Delete ECS Service and Tasks
          aws ecs update-service --cluster journalai-dev-cluster --service journalai-dev-service --desired-count 0 2>/dev/null
          sleep 10
          aws ecs delete-service --cluster journalai-dev-cluster --service journalai-dev-service --force 2>/dev/null
          TASK_ARNS=$(aws ecs list-tasks --cluster journalai-dev-cluster --query 'taskArns[]' --output text 2>/dev/null)
          for TASK in $TASK_ARNS; do aws ecs stop-task --cluster journalai-dev-cluster --task "$TASK" 2>/dev/null; done
          
          # Delete Service Discovery
          NAMESPACE_ID=$(aws servicediscovery list-namespaces --query "Namespaces[?Name=='journalai-dev.local'].Id | [0]" --output text 2>/dev/null)
          if [ -n "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
            SERVICE_ID=$(aws servicediscovery list-services --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" --query "Services[?Name=='backend'].Id | [0]" --output text 2>/dev/null)
            if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "None" ]; then
              INSTANCES=$(aws servicediscovery list-instances --service-id "$SERVICE_ID" --query 'Instances[].Id' --output text 2>/dev/null)
              for INSTANCE_ID in $INSTANCES; do
                aws servicediscovery deregister-instance --service-id "$SERVICE_ID" --instance-id "$INSTANCE_ID" 2>/dev/null
              done
              sleep 5
              aws servicediscovery delete-service --id "$SERVICE_ID" 2>/dev/null
            fi
            aws servicediscovery delete-namespace --id "$NAMESPACE_ID" 2>/dev/null
          fi
          
          # Delete API Gateway
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text 2>/dev/null)
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            for ROUTE_ID in $(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[].RouteId" --output text 2>/dev/null); do
              aws apigatewayv2 delete-route --api-id "$API_ID" --route-id "$ROUTE_ID" 2>/dev/null
            done
            for INT_ID in $(aws apigatewayv2 get-integrations --api-id "$API_ID" --query "Items[].IntegrationId" --output text 2>/dev/null); do
              aws apigatewayv2 delete-integration --api-id "$API_ID" --integration-id "$INT_ID" 2>/dev/null
            done
            aws apigatewayv2 delete-stage --api-id "$API_ID" --stage-name prod 2>/dev/null
            aws apigatewayv2 delete-api --api-id "$API_ID" 2>/dev/null
          fi
          
          # Delete VPC Link
          VPC_LINK_ID=$(aws apigatewayv2 get-vpc-links --query "Items[?Name=='journalai-dev-vpc-link'].VpcLinkId | [0]" --output text 2>/dev/null)
          [ -n "$VPC_LINK_ID" ] && [ "$VPC_LINK_ID" != "None" ] && aws apigatewayv2 delete-vpc-link --vpc-link-id "$VPC_LINK_ID" 2>/dev/null
          
          # Delete ECS Cluster
          aws ecs delete-cluster --cluster journalai-dev-cluster 2>/dev/null
          
          # Delete CloudWatch Logs
          aws logs delete-log-group --log-group-name /ecs/journalai-dev-service 2>/dev/null
          
          # Delete ECR Repository
          aws ecr delete-repository --repository-name journalai-dev-backend --force 2>/dev/null
          
          # Delete RDS
          aws rds delete-db-instance --db-instance-identifier journalai-dev-db --skip-final-snapshot --delete-automated-backups 2>/dev/null
          for i in {1..30}; do
            STATUS=$(aws rds describe-db-instances --db-instance-identifier journalai-dev-db --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null)
            [ -z "$STATUS" ] || [ "$STATUS" = "None" ] && break
            sleep 10
          done
          aws rds delete-db-subnet-group --db-subnet-group-name journalai-dev-db-subnets 2>/dev/null
          
          # Delete Security Groups
          for SG_NAME in journalai-dev-ecs-tasks-sg journalai-dev-apigw-vpc-link-sg journalai-dev-rds-sg; do
            SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values="$SG_NAME" Name=vpc-id,Values="$VPC_ID" --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)
            if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --ip-permissions "$(aws ec2 describe-security-groups --group-ids "$SG_ID" --query 'SecurityGroups[0].IpPermissions' 2>/dev/null || echo '[]')" 2>/dev/null
              aws ec2 delete-security-group --group-id "$SG_ID" 2>/dev/null
            fi
          done
          
          # Delete IAM Role
          aws iam detach-role-policy --role-name journalai-dev-ecsTaskExecutionRole --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy 2>/dev/null
          aws iam delete-role --role-name journalai-dev-ecsTaskExecutionRole 2>/dev/null
          
          echo "Destruction complete!"

  infrastructure:
    name: Provision Infrastructure
    needs: destroy-all  # Remove this dependency after first run
    runs-on: ubuntu-latest
    outputs:
      ecr_repository_url: ${{ steps.outputs.outputs.ecr_repository_url }}
      ecs_cluster_name: ${{ steps.outputs.outputs.ecs_cluster_name }}
      ecs_service_name: ${{ steps.outputs.outputs.ecs_service_name }}
      ecs_task_family: ${{ steps.outputs.outputs.ecs_task_family }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false  # Important for getting outputs
      
      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: |
          if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ] && [ -n "${{ secrets.TF_BACKEND_KEY }}" ]; then
            terraform init \
              -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
              -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
              -backend-config="region=${{ secrets.TF_BACKEND_REGION || env.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"
          else
            rm -f backend.tf
            terraform init
          fi
      
      - name: Import Existing Resources
        working-directory: infrastructure/terraform
        run: |
          set +e  # Continue on errors (resources might not exist)
          
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          
          # Try to import all resources that might exist
          terraform import aws_ecr_repository.backend journalai-dev-backend 2>/dev/null || true
          terraform import aws_ecs_cluster.this journalai-dev-cluster 2>/dev/null || true
          terraform import aws_ecs_service.backend journalai-dev-cluster/journalai-dev-service 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.ecs /ecs/journalai-dev-service 2>/dev/null || true
          terraform import aws_iam_role.ecs_task_execution_role journalai-dev-ecsTaskExecutionRole 2>/dev/null || true
          terraform import aws_db_instance.postgres journalai-dev-db 2>/dev/null || true
          terraform import aws_db_subnet_group.db journalai-dev-db-subnets 2>/dev/null || true
          
          # Import Service Discovery
          NAMESPACE_ID=$(aws servicediscovery list-namespaces --query "Namespaces[?Name=='journalai-dev.local'].Id | [0]" --output text 2>/dev/null)
          if [ -n "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
            terraform import aws_service_discovery_private_dns_namespace.this "${NAMESPACE_ID}:${VPC_ID}" 2>/dev/null || true
            SERVICE_ID=$(aws servicediscovery list-services --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" --query "Services[?Name=='backend'].Id | [0]" --output text 2>/dev/null)
            [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "None" ] && terraform import aws_service_discovery_service.backend "$SERVICE_ID" 2>/dev/null || true
          fi
          
          # Import Security Groups
          for SG_NAME in journalai-dev-ecs-tasks-sg journalai-dev-apigw-vpc-link-sg journalai-dev-rds-sg; do
            SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values="$SG_NAME" Name=vpc-id,Values="$VPC_ID" --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)
            if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              RESOURCE_NAME=$(echo $SG_NAME | sed 's/journalai-dev-//' | sed 's/-sg$//' | tr '-' '_')
              terraform import aws_security_group.${RESOURCE_NAME} "$SG_ID" 2>/dev/null || true
            fi
          done
          
          # Import API Gateway
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text 2>/dev/null)
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            terraform import aws_apigatewayv2_api.http_api "$API_ID" 2>/dev/null || true
            terraform import aws_apigatewayv2_stage.prod "${API_ID}/prod" 2>/dev/null || true
            
            VPC_LINK_ID=$(aws apigatewayv2 get-vpc-links --query "Items[?Name=='journalai-dev-vpc-link'].VpcLinkId | [0]" --output text 2>/dev/null)
            [ -n "$VPC_LINK_ID" ] && [ "$VPC_LINK_ID" != "None" ] && terraform import aws_apigatewayv2_vpc_link.this "$VPC_LINK_ID" 2>/dev/null || true
            
            INT_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --query "Items[0].IntegrationId" --output text 2>/dev/null)
            [ -n "$INT_ID" ] && [ "$INT_ID" != "None" ] && terraform import aws_apigatewayv2_integration.backend "${API_ID}/${INT_ID}" 2>/dev/null || true
            
            for ROUTE_KEY in "ANY /" "ANY /{proxy+}"; do
              ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='$ROUTE_KEY'].RouteId | [0]" --output text 2>/dev/null)
              if [ -n "$ROUTE_ID" ] && [ "$ROUTE_ID" != "None" ]; then
                [ "$ROUTE_KEY" = "ANY /" ] && terraform import aws_apigatewayv2_route.root "${API_ID}/${ROUTE_ID}" 2>/dev/null || true
                [ "$ROUTE_KEY" = "ANY /{proxy+}" ] && terraform import aws_apigatewayv2_route.proxy "${API_ID}/${ROUTE_ID}" 2>/dev/null || true
              fi
            done
          fi
          
          echo "Import complete"
      
      - name: Terraform Apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: placeholder  # Will be updated after build
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
        run: |
          terraform validate
          terraform apply -auto-approve
      
      - name: Get Terraform Outputs
        id: outputs
        working-directory: infrastructure/terraform
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-cluster" >> $GITHUB_OUTPUT
          echo "ecs_service_name=${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-service" >> $GITHUB_OUTPUT
          echo "ecs_task_family=${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-task" >> $GITHUB_OUTPUT

  build:
    name: Build & Push Docker Image
    needs: infrastructure
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Set Image Metadata
        id: meta
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=${{ needs.infrastructure.outputs.ecr_repository_url }}" >> $GITHUB_OUTPUT
      
      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build -f Dockerfile \
            -t ${{ steps.meta.outputs.ecr_repository_url }}:${{ steps.meta.outputs.image_tag }} \
            -t ${{ steps.meta.outputs.ecr_repository_url }}:dev-latest \
            .
      
      - name: Push Docker Image
        run: |
          docker push ${{ steps.meta.outputs.ecr_repository_url }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.meta.outputs.ecr_repository_url }}:dev-latest

  deploy:
    name: Deploy to ECS
    needs: [infrastructure, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update ECS Service
        run: |
          # Get current task definition
          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition ${{ needs.infrastructure.outputs.ecs_task_family }} \
            --query 'taskDefinition' \
            --output json)
          
          # Update the image in container definitions
          NEW_TASK_DEF=$(echo $TASK_DEFINITION | \
            jq --arg IMAGE "${{ needs.infrastructure.outputs.ecr_repository_url }}:${{ needs.build.outputs.image_tag }}" \
            '.containerDefinitions[0].image = $IMAGE | .containerDefinitions[2].image = $IMAGE | .containerDefinitions[3].image = $IMAGE')
          
          # Remove fields that can't be in register request
          NEW_TASK_DEF=$(echo $NEW_TASK_DEF | \
            jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          
          # Register new task definition
          NEW_TASK_ARN=$(echo $NEW_TASK_DEF | \
            aws ecs register-task-definition --cli-input-json file:///dev/stdin \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          
          echo "New task definition: $NEW_TASK_ARN"
          
          # Update service with new task definition
          aws ecs update-service \
            --cluster ${{ needs.infrastructure.outputs.ecs_cluster_name }} \
            --service ${{ needs.infrastructure.outputs.ecs_service_name }} \
            --task-definition $NEW_TASK_ARN \
            --force-new-deployment
          
          # Wait for service to stabilize
          aws ecs wait services-stable \
            --cluster ${{ needs.infrastructure.outputs.ecs_cluster_name }} \
            --services ${{ needs.infrastructure.outputs.ecs_service_name }}
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      
      - name: Get API URL
        id: api-url
        working-directory: infrastructure/terraform
        run: |
          if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ] && [ -n "${{ secrets.TF_BACKEND_KEY }}" ]; then
            terraform init \
              -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
              -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
              -backend-config="region=${{ secrets.TF_BACKEND_REGION || env.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"
          else
            rm -f backend.tf
            terraform init
          fi
          echo "api_url=$(terraform output -raw api_gateway_invoke_url)" >> $GITHUB_OUTPUT
      
      - name: Health Check
        run: |
          API_URL="${{ steps.api-url.outputs.api_url }}"
          echo "Checking $API_URL/health"
          
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $code, retrying..."
            sleep 10
          done
          
          echo "❌ Health check failed after 30 attempts"
          exit 1