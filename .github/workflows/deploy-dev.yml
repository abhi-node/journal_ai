name: Deploy Dev (ECS + API GW via Terraform)

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-dev.yml'
      - 'infrastructure/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: journalai-dev-backend
  PROJECT: journalai
  ENVIRONMENT: dev

jobs:
  # TEMPORARY: Remove this job after first run
  destroy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Force Delete All Infrastructure
        run: |
          echo "Force deleting all infrastructure with naming pattern: journalai-dev-*"
          
          # 1. Delete ECS Service (must be done before cluster)
          echo "Deleting ECS Service..."
          aws ecs update-service --cluster journalai-dev-cluster --service journalai-dev-service --desired-count 0 2>/dev/null || true
          sleep 10
          aws ecs delete-service --cluster journalai-dev-cluster --service journalai-dev-service --force 2>/dev/null || true
          
          # 2. Delete all tasks in cluster
          echo "Stopping all ECS tasks..."
          TASK_ARNS=$(aws ecs list-tasks --cluster journalai-dev-cluster --query 'taskArns[]' --output text 2>/dev/null || echo "")
          for TASK in $TASK_ARNS; do
            aws ecs stop-task --cluster journalai-dev-cluster --task "$TASK" 2>/dev/null || true
          done
          sleep 10
          
          # 3. Delete Service Discovery
          echo "Deleting Service Discovery..."
          NAMESPACE_ID=$(aws servicediscovery list-namespaces --query "Namespaces[?Name=='journalai-dev.local'].Id | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
            # Get and delete service
            SERVICE_ID=$(aws servicediscovery list-services --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" --query "Services[?Name=='backend'].Id | [0]" --output text 2>/dev/null || echo "")
            if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "None" ]; then
              # Deregister all instances first
              INSTANCES=$(aws servicediscovery list-instances --service-id "$SERVICE_ID" --query 'Instances[].Id' --output text 2>/dev/null || echo "")
              for INSTANCE_ID in $INSTANCES; do
                aws servicediscovery deregister-instance --service-id "$SERVICE_ID" --instance-id "$INSTANCE_ID" 2>/dev/null || true
              done
              sleep 5
              aws servicediscovery delete-service --id "$SERVICE_ID" 2>/dev/null || true
            fi
            # Delete namespace
            aws servicediscovery delete-namespace --id "$NAMESPACE_ID" 2>/dev/null || true
          fi
          
          # 4. Delete API Gateway resources
          echo "Deleting API Gateway..."
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            # Delete routes first
            ROUTE_IDS=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[].RouteId" --output text 2>/dev/null || echo "")
            for ROUTE_ID in $ROUTE_IDS; do
              aws apigatewayv2 delete-route --api-id "$API_ID" --route-id "$ROUTE_ID" 2>/dev/null || true
            done
            # Delete integrations
            INT_IDS=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --query "Items[].IntegrationId" --output text 2>/dev/null || echo "")
            for INT_ID in $INT_IDS; do
              aws apigatewayv2 delete-integration --api-id "$API_ID" --integration-id "$INT_ID" 2>/dev/null || true
            done
            # Delete stages
            aws apigatewayv2 delete-stage --api-id "$API_ID" --stage-name prod 2>/dev/null || true
            # Delete API
            aws apigatewayv2 delete-api --api-id "$API_ID" 2>/dev/null || true
          fi
          
          # 5. Delete VPC Link
          echo "Deleting VPC Link..."
          VPC_LINK_ID=$(aws apigatewayv2 get-vpc-links --query "Items[?Name=='journalai-dev-vpc-link'].VpcLinkId | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$VPC_LINK_ID" ] && [ "$VPC_LINK_ID" != "None" ]; then
            aws apigatewayv2 delete-vpc-link --vpc-link-id "$VPC_LINK_ID" 2>/dev/null || true
          fi
          
          # 6. Delete ECS Cluster
          echo "Deleting ECS Cluster..."
          aws ecs delete-cluster --cluster journalai-dev-cluster 2>/dev/null || true
          
          # 7. Delete Task Definitions (deregister all revisions)
          echo "Deregistering Task Definitions..."
          TASK_DEF_ARNS=$(aws ecs list-task-definitions --family-prefix journalai-dev --query 'taskDefinitionArns[]' --output text 2>/dev/null || echo "")
          for TASK_DEF in $TASK_DEF_ARNS; do
            aws ecs deregister-task-definition --task-definition "$TASK_DEF" 2>/dev/null || true
          done
          
          # 8. Delete CloudWatch Log Group
          echo "Deleting CloudWatch Logs..."
          aws logs delete-log-group --log-group-name /ecs/journalai-dev-service 2>/dev/null || true
          
          # 9. Delete ECR Repository (with all images)
          echo "Deleting ECR Repository..."
          aws ecr delete-repository --repository-name journalai-dev-backend --force 2>/dev/null || true
          
          # 10. Delete RDS Instance
          echo "Deleting RDS Instance..."
          aws rds delete-db-instance --db-instance-identifier journalai-dev-db --skip-final-snapshot --delete-automated-backups 2>/dev/null || true
          
          # Wait for RDS deletion to proceed
          echo "Waiting for RDS deletion..."
          for i in {1..30}; do
            STATUS=$(aws rds describe-db-instances --db-instance-identifier journalai-dev-db --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "deleted")
            if [ "$STATUS" = "deleted" ] || [ "$STATUS" = "deleting" ]; then
              break
            fi
            echo "RDS status: $STATUS, waiting..."
            sleep 10
          done
          
          # 11. Delete DB Subnet Group (after RDS is deleted)
          echo "Deleting DB Subnet Group..."
          aws rds delete-db-subnet-group --db-subnet-group-name journalai-dev-db-subnets 2>/dev/null || true
          
          # 12. Delete Security Groups
          echo "Deleting Security Groups..."
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          for SG_NAME in journalai-dev-ecs-tasks-sg journalai-dev-apigw-vpc-link-sg journalai-dev-rds-sg; do
            SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values="$SG_NAME" Name=vpc-id,Values="$VPC_ID" --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
            if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              # Remove all ingress rules first
              aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --ip-permissions "$(aws ec2 describe-security-groups --group-ids "$SG_ID" --query 'SecurityGroups[0].IpPermissions' 2>/dev/null || echo '[]')" 2>/dev/null || true
              # Delete the security group
              aws ec2 delete-security-group --group-id "$SG_ID" 2>/dev/null || true
            fi
          done
          
          # 13. Delete IAM Role and Policies
          echo "Deleting IAM Role..."
          # Detach all policies first
          ATTACHED_POLICIES=$(aws iam list-attached-role-policies --role-name journalai-dev-ecsTaskExecutionRole --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || echo "")
          for POLICY_ARN in $ATTACHED_POLICIES; do
            aws iam detach-role-policy --role-name journalai-dev-ecsTaskExecutionRole --policy-arn "$POLICY_ARN" 2>/dev/null || true
          done
          # Delete the role
          aws iam delete-role --role-name journalai-dev-ecsTaskExecutionRole 2>/dev/null || true
          
          echo "Force deletion complete!"
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      
      - name: Terraform Destroy (Clean State)
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: dev-latest
          TF_VAR_secret_key: placeholder
          TF_VAR_openai_api_key: placeholder
          TF_VAR_db_password: placeholder
          TF_INPUT: "false"
        run: |
          # Initialize with clean state
          rm -f backend.tf
          terraform init
          
          # Destroy any remaining Terraform-managed resources
          terraform destroy -auto-approve || echo "Nothing to destroy in Terraform state"
  
  build-and-deploy:
    needs: destroy-infrastructure  # Remove this dependency after first run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Create ECR and Build Docker Image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Create ECR repository
          aws ecr create-repository --repository-name $ECR_REPO --image-scanning-configuration scanOnPush=true 2>/dev/null || \
            echo "ECR repository already exists or creation failed"
          
          # Build and push image
          docker build -f Dockerfile -t $REGISTRY/$ECR_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_REPO:dev-latest .
          docker push $REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO:dev-latest
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      
      - name: Terraform Deploy (Fresh)
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: dev-latest
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
          TF_INPUT: "false"
        run: |
          # Check if backend config is provided
          if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ] && [ -n "${{ secrets.TF_BACKEND_KEY }}" ]; then
            # Initialize with S3 backend
            terraform init \
              -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
              -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
              -backend-config="region=${{ secrets.TF_BACKEND_REGION || env.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"
          else
            # Use local backend if no S3 config provided
            rm -f backend.tf
            terraform init
          fi
          
          # Validate configuration
          terraform validate
          
          # Apply configuration (everything should be created fresh)
          terraform apply -auto-approve
      
      - name: Verify Deployment
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Get API URL from Terraform output
          cd infrastructure/terraform
          API_URL=$(terraform output -raw api_gateway_invoke_url)
          
          # Health check with retries
          echo "Checking $API_URL/health"
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1