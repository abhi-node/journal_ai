      - name: Terraform Apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: placeholder  # Will be updated after build
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
        run: |
          echo "Running Terraform validate..."
          terraform validate
          
          echo ""
          echo "Running Terraform plan to preview changes..."
          terraform plan -out=tfplan
          
          echo ""
          echo "Applying Terraform configuration..."
          # Use -refresh=true to ensure state matches reality before applying
          terraform apply -auto-approve -refresh=true tfplan || {
            echo ""
            echo "❌ Terraform apply failed!"
            echo ""
            echo "Common issues and solutions:"
            echo "1. Resource conflicts: Resources exist in AWS but not in Terraform state"
            echo "   Solution: Check the import step above and ensure all resources are imported"
            echo ""
            echo "2. The specific error about 'Route with key ANY /{proxy+} already exists'"
            echo "   indicates the route exists in AWS but wasn't imported properly."
            echo ""
            echo "Attempting automatic fix for route conflicts..."
            
            # Try to delete conflicting routes if they exist
            API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text)
            if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
              # Check if the proxy route exists
              PROXY_ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId | [0]" --output text)
              if [ -n "$PROXY_ROUTE_ID" ] && [ "$PROXY_ROUTE_ID" != "None" ]; then
                echo "Found existing proxy route: $PROXY_ROUTE_ID"
                echo "Importing it into Terraform state..."
                terraform import aws_apigatewayv2_route.proxy "${API_ID}/${PROXY_ROUTE_ID}"
                
                echo "Retrying Terraform apply..."
                terraform apply -auto-approve -refresh=true
              fi
            fi
          }
      
      - name: Get Terraform Outputs
        id: outputs
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: placeholder
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
        run: |
          echo "========================================="
          echo "Retrieving Terraform Outputs"
          echo "========================================="
          
          # Debug: Show current directory and files
          echo "Current directory: $(pwd)"
          echo "Terraform files present:"
          ls -la *.tf 2>/dev/null || echo "No .tf files found"
          
          # Check if terraform state exists
          if [ -f terraform.tfstate ]; then
            echo "Local terraform.tfstate found"
          else
            echo "No local terraform.tfstate, checking for remote backend..."
            
            # Re-initialize terraform to ensure we can access state
            if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ] && [ -n "${{ secrets.TF_BACKEND_KEY }}" ]; then
              echo "Initializing with S3 backend..."
              terraform init \
                -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
                -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
                -backend-config="region=${{ secrets.TF_BACKEND_REGION || env.AWS_REGION }}" \
                -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}" \
                -reconfigure
            else
              echo "No backend configuration provided, using local state"
            fi
          fi
          
          # List all available outputs
          echo ""
          echo "Available Terraform outputs:"
          terraform output -json | jq 'keys' 2>/dev/null || echo "Could not list outputs"
          
          # Get the ECR repository URL from Terraform output
          echo ""
          echo "Attempting to get ECR repository URL from Terraform..."
          ECR_URL=$(terraform output -raw ecr_repository_url 2>&1)
          TERRAFORM_EXIT_CODE=$?
          
          # Check if terraform output worked
          if [ $TERRAFORM_EXIT_CODE -ne 0 ] || [ -z "$ECR_URL" ] || [[ "$ECR_URL" == *"No outputs found"* ]]; then
            echo "Warning: Could not get ECR URL from Terraform output"
            echo "Terraform output response: $ECR_URL"
            echo ""
            echo "Fetching from AWS directly..."
            
            # Get from AWS as fallback
            ECR_URL=$(aws ecr describe-repositories \
              --repository-names journalai-dev-backend \
              --query 'repositories[0].repositoryUri' \
              --output text 2>/dev/null)
            
            if [ "$ECR_URL" = "None" ]; then
              ECR_URL=""
            fi
          fi
          
          # Final validation
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "null" ]; then
            echo "ERROR: Could not determine ECR repository URL!"
            echo ""
            echo "Debugging information:"
            echo "- Terraform state list:"
            terraform state list | head -20
            echo ""
            echo "- ECR repositories in AWS:"
            aws ecr describe-repositories --query 'repositories[].repositoryName' --output json
            exit 1
          fi
          
          # Validate ECR URL format
          if [[ ! "$ECR_URL" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9-]+ ]]; then
            echo "Warning: ECR URL format looks unusual: $ECR_URL"
          fi
          
          echo ""
          echo "✅ Successfully retrieved outputs:"
          echo "   ECR Repository URL: $ECR_URL"
          
          # Set all outputs
          echo "ecr_repository_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-cluster" >> $GITHUB_OUTPUT
          echo "ecs_service_name=${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-service" >> $GITHUB_OUTPUT
          echo "ecs_task_family=${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-task" >> $GITHUB_OUTPUT
          
          # Debug: Verify outputs were set
          echo ""
          echo "GitHub outputs set:"
          cat $GITHUB_OUTPUT

  build:
    name: Build & Push Docker Image
    needs: infrastructure
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Validate and Set Image Metadata
        id: meta
        run: |
          # Get ECR URL from infrastructure job output
          ECR_URL="${{ needs.infrastructure.outputs.ecr_repository_url }}"
          IMAGE_TAG="${{ github.sha }}"
          
          # Debug output
          echo "Received ECR URL from infrastructure: '$ECR_URL'"
          echo "Image tag: $IMAGE_TAG"
          
          # Validate ECR URL
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "null" ]; then
            echo "ERROR: ECR repository URL is empty or null!"
            echo "Attempting to fetch from AWS directly..."
            
            # Try to get it from AWS as fallback
            ECR_URL=$(aws ecr describe-repositories \
              --repository-names journalai-dev-backend \
              --query 'repositories[0].repositoryUri' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
              echo "ERROR: Could not determine ECR repository URL from AWS either!"
              echo "Please ensure the ECR repository 'journalai-dev-backend' exists."
              exit 1
            fi
            
            echo "Retrieved ECR URL from AWS: $ECR_URL"
          fi
          
          # Validate ECR URL format
          if [[ ! "$ECR_URL" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9-]+ ]]; then
            echo "ERROR: Invalid ECR URL format: $ECR_URL"
            echo "Expected format: {account}.dkr.ecr.{region}.amazonaws.com/{repository}"
            exit 1
          fi
          
          # Output the validated values
          echo "ecr_repository_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # Also export as env vars for debugging
          echo "ECR_REPOSITORY_URL=$ECR_URL" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          
          echo "✅ Metadata set successfully:"
          echo "   Repository: $ECR_URL"
          echo "   Tag: $IMAGE_TAG"
      
      - name: Build Docker Image
        working-directory: backend
        run: |
          # Use the validated ECR URL and tag
          ECR_URL="${{ steps.meta.outputs.ecr_repository_url }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          
          echo "Building Docker image..."
          echo "  Repository: $ECR_URL"
          echo "  Tags: $IMAGE_TAG, dev-latest"
          
          docker build -f Dockerfile \
            -t "${ECR_URL}:${IMAGE_TAG}" \
            -t "${ECR_URL}:dev-latest" \
            .
          
          echo "✅ Docker image built successfully"
          docker images | grep "$ECR_URL"
      
      - name: Push Docker Image
        run: |
          ECR_URL="${{ steps.meta.outputs.ecr_repository_url }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          
          echo "Pushing Docker images to ECR..."
          echo "  Repository: $ECR_URL"
          
          docker push "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:dev-latest"
          
          echo "✅ Docker images pushed successfully"

  deploy:
    name: Deploy to ECS
    needs: [infrastructure, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update ECS Service
        run: |
          echo "========================================="
          echo "UPDATING ECS SERVICE"
          echo "========================================="
          
          # Get ECR URL - fallback to AWS query if not provided
          ECR_URL="${{ needs.infrastructure.outputs.ecr_repository_url }}"
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "" ]; then
            echo "ECR URL not provided from infrastructure job, fetching from AWS..."
            ECR_URL=$(aws ecr describe-repositories \
              --repository-names journalai-dev-backend \
              --query 'repositories[0].repositoryUri' \
              --output text)
          fi
          
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          
          echo "ECR Repository: $ECR_URL"
          echo "Image Tag: $IMAGE_TAG"
          
          if [ -z "$ECR_URL" ] || [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: Missing ECR URL or image tag!"
            exit 1
          fi
          
          FULL_IMAGE="${ECR_URL}:${IMAGE_TAG}"
          echo "Full Image URI: $FULL_IMAGE"
          echo ""
          
          # Get current task definition
          echo "Fetching current task definition..."
          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition ${{ needs.infrastructure.outputs.ecs_task_family }} \
            --query 'taskDefinition' \
            --output json)
          
          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "null" ]; then
            echo "ERROR: Could not retrieve task definition!"
            exit 1
          fi
          
          # Debug: Show container names and current images
          echo "Current container definitions:"
          echo "$TASK_DEFINITION" | jq -r '.containerDefinitions[] | "\(.name): \(.image)"'
          echo ""
          
          # Update images for all containers that use the backend image
          # This updates backend and celery_worker containers by name
          echo "Updating container images..."
          NEW_TASK_DEF=$(echo "$TASK_DEFINITION" | jq --arg IMAGE "$FULL_IMAGE" '
            .containerDefinitions |= map(
              if .name == "backend" or .name == "celery_worker" 
              then .image = $IMAGE 
              else . 
              end
            )
          ')
          
          # Remove fields that can't be in register request
          echo "Cleaning task definition for registration..."
          NEW_TASK_DEF=$(echo "$NEW_TASK_DEF" | jq '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, 
                .compatibilities, .registeredAt, .registeredBy, .requiresCompatibilities)
          ')
          
          # Debug: Verify the JSON is valid
          echo "Validating JSON..."
          echo "$NEW_TASK_DEF" | jq empty || {
            echo "ERROR: Invalid JSON generated!"
            echo "JSON content:"
            echo "$NEW_TASK_DEF"
            exit 1
          }
          
          # Save to temp file for debugging if needed
          echo "$NEW_TASK_DEF" > /tmp/task-definition.json
          
          # Register new task definition
          echo "Registering new task definition..."
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          if [ -z "$NEW_TASK_ARN" ] || [ "$NEW_TASK_ARN" = "None" ]; then
            echo "ERROR: Failed to register task definition!"
            echo "Task definition content saved to /tmp/task-definition.json"
            exit 1
          fi
          
          echo "✅ New task definition registered: $NEW_TASK_ARN"
          echo ""
          
          # Update service with new task definition
          echo "Updating ECS service..."
          aws ecs update-service \
            --cluster ${{ needs.infrastructure.outputs.ecs_cluster_name }} \
            --service ${{ needs.infrastructure.outputs.ecs_service_name }} \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment
          
          echo "✅ Service update initiated"
          echo ""
          
          # Wait for service to stabilize
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ needs.infrastructure.outputs.ecs_cluster_name }} \
            --services ${{ needs.infrastructure.outputs.ecs_service_name }}
          
          echo "✅ Service deployment complete!"

  health-check:
    name: Comprehensive Health Verification
    needs: [infrastructure, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      
      - name: Get Infrastructure Outputs
        id: outputs
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: ${{ env.PROJECT }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_image_tag: placeholder
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
        run: |
          echo "========================================="
          echo "RETRIEVING INFRASTRUCTURE OUTPUTS"
          echo "========================================="
          
          # Initialize Terraform to access outputs
          if [ -n "${{ secrets.TF_BACKEND_BUCKET }}" ] && [ -n "${{ secrets.TF_BACKEND_KEY }}" ]; then
            echo "Initializing with S3 backend..."
            terraform init \
              -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
              -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
              -backend-config="region=${{ secrets.TF_BACKEND_REGION || env.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}" \
              -reconfigure
          else
            echo "Initializing with local backend..."
            rm -f backend.tf
            terraform init
          fi
          
          # Try to get outputs from Terraform
          echo ""
          echo "Attempting to get Terraform outputs..."
          
          # Get API URL
          API_URL=$(terraform output -raw api_gateway_invoke_url 2>/dev/null || echo "")
          if [ -z "$API_URL" ] || [[ "$API_URL" == *"No outputs found"* ]]; then
            echo "Terraform output not available, constructing API URL..."
            API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text)
            if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
              API_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
            fi
          fi
          
          # Get API ID
          API_ID=$(terraform output -raw api_gateway_id 2>/dev/null || echo "")
          if [ -z "$API_ID" ] || [[ "$API_ID" == *"No outputs found"* ]]; then
            echo "Getting API ID from AWS..."
            API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text)
          fi
          
          # Get VPC Link ID
          VPC_LINK_ID=$(terraform output -raw vpc_link_id 2>/dev/null || echo "")
          if [ -z "$VPC_LINK_ID" ] || [[ "$VPC_LINK_ID" == *"No outputs found"* ]]; then
            echo "Getting VPC Link ID from AWS..."
            VPC_LINK_ID=$(aws apigatewayv2 get-vpc-links --query "Items[?Name=='journalai-dev-vpc-link'].VpcLinkId | [0]" --output text)
          fi
          
          # Validate and output
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "Warning: Could not determine API URL"
            API_URL=""
          else
            echo "✅ API URL: $API_URL"
          fi
          
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "Warning: Could not determine API ID"
            API_ID=""
          else
            echo "✅ API ID: $API_ID"
          fi
          
          if [ -z "$VPC_LINK_ID" ] || [ "$VPC_LINK_ID" = "None" ]; then
            echo "Warning: Could not determine VPC Link ID"
            VPC_LINK_ID=""
          else
            echo "✅ VPC Link ID: $VPC_LINK_ID"
          fi
          
          # Set outputs
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "api_id=$API_ID" >> $GITHUB_OUTPUT
          echo "vpc_link_id=$VPC_LINK_ID" >> $GITHUB_OUTPUT
          
          echo ""
          echo "Outputs set to GitHub:"
          cat $GITHUB_OUTPUT
      
      - name: Verify API Gateway Status
        run: |
          echo "========================================="
          echo "VERIFYING API GATEWAY"
          echo "========================================="
          
          # Get API Gateway ID (either from Terraform output or by searching)
          API_ID="${{ steps.outputs.outputs.api_id }}"
          if [ -z "$API_ID" ]; then
            API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text)
          fi
          
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "❌ API Gateway not found!"
            exit 1
          fi
          
          echo "✅ API Gateway ID: $API_ID"
          
          # Check API status
          API_STATUS=$(aws apigatewayv2 get-api --api-id "$API_ID" --query 'ProtocolType' --output text)
          echo "   Protocol: $API_STATUS"
          
          # Check if stage exists
          STAGE_EXISTS=$(aws apigatewayv2 get-stage --api-id "$API_ID" --stage-name prod --query 'StageName' --output text 2>/dev/null || echo "")
          if [ -z "$STAGE_EXISTS" ]; then
            echo "❌ Production stage not found!"
            exit 1
          fi
          echo "✅ Production stage exists"
          
          # Check routes
          ROUTE_COUNT=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query 'length(Items)' --output text)
          echo "✅ Routes configured: $ROUTE_COUNT"
          
          if [ "$ROUTE_COUNT" -eq 0 ]; then
            echo "❌ No routes configured!"
            exit 1
          fi
      
      - name: Verify VPC Link Status
        run: |
          echo "========================================="
          echo "VERIFYING VPC LINK"
          echo "========================================="
          
          # Get VPC Link ID
          VPC_LINK_ID="${{ steps.outputs.outputs.vpc_link_id }}"
          if [ -z "$VPC_LINK_ID" ]; then
            VPC_LINK_ID=$(aws apigatewayv2 get-vpc-links --query "Items[?Name=='journalai-dev-vpc-link'].VpcLinkId | [0]" --output text)
          fi
          
          if [ -z "$VPC_LINK_ID" ] || [ "$VPC_LINK_ID" = "None" ]; then
            echo "❌ VPC Link not found!"
            exit 1
          fi
          
          echo "✅ VPC Link ID: $VPC_LINK_ID"
          
          # Check VPC Link status
          VPC_LINK_STATUS=$(aws apigatewayv2 get-vpc-link --vpc-link-id "$VPC_LINK_ID" --query 'VpcLinkStatus' --output text)
          echo "   Status: $VPC_LINK_STATUS"
          
          if [ "$VPC_LINK_STATUS" != "AVAILABLE" ]; then
            echo "❌ VPC Link is not available (status: $VPC_LINK_STATUS)"
            exit 1
          fi
          
          echo "✅ VPC Link is AVAILABLE"
      
      - name: Verify ECS Tasks Status
        run: |
          echo "========================================="
          echo "VERIFYING ECS TASKS"
          echo "========================================="
          
          CLUSTER_NAME="${{ needs.infrastructure.outputs.ecs_cluster_name }}"
          SERVICE_NAME="${{ needs.infrastructure.outputs.ecs_service_name }}"
          
          # Check service status
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].status' --output text)
          
          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            echo "❌ ECS Service is not ACTIVE (status: $SERVICE_STATUS)"
            exit 1
          fi
          
          echo "✅ ECS Service is ACTIVE"
          
          # Check running tasks count
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].runningCount' --output text)
          
          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].desiredCount' --output text)
          
          echo "   Desired tasks: $DESIRED_COUNT"
          echo "   Running tasks: $RUNNING_COUNT"
          
          if [ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]; then
            echo "⚠️  Warning: Not all tasks are running yet"
          else
            echo "✅ All tasks are running"
          fi
          
          # List running task ARNs
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster "$CLUSTER_NAME" \
            --service-name "$SERVICE_NAME" \
            --desired-status RUNNING \
            --query 'taskArns' --output json)
          
          if [ "$TASK_ARNS" = "[]" ]; then
            echo "❌ No running tasks found!"
            exit 1
          fi
          
          # Check each task's health status
          echo ""
          echo "Task Health Status:"
          for TASK_ARN in $(echo $TASK_ARNS | jq -r '.[]'); do
            TASK_ID=$(echo $TASK_ARN | rev | cut -d'/' -f1 | rev | cut -d':' -f1)
            HEALTH_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER_NAME" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].healthStatus' --output text)
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER_NAME" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' --output text)
            echo "   Task $TASK_ID: $LAST_STATUS (Health: $HEALTH_STATUS)"
          done
      
      - name: Verify Service Discovery
        run: |
          echo "========================================="
          echo "VERIFYING SERVICE DISCOVERY"
          echo "========================================="
          
          # Check namespace exists
          NAMESPACE_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='journalai-dev.local'].Id | [0]" --output text)
          
          if [ -z "$NAMESPACE_ID" ] || [ "$NAMESPACE_ID" = "None" ]; then
            echo "❌ Service Discovery namespace not found!"
            exit 1
          fi
          
          echo "✅ Namespace ID: $NAMESPACE_ID"
          
          # Check service exists
          SERVICE_ID=$(aws servicediscovery list-services \
            --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" \
            --query "Services[?Name=='backend'].Id | [0]" --output text)
          
          if [ -z "$SERVICE_ID" ] || [ "$SERVICE_ID" = "None" ]; then
            echo "❌ Service Discovery service not found!"
            exit 1
          fi
          
          echo "✅ Service ID: $SERVICE_ID"
          
          # Check registered instances
          INSTANCE_COUNT=$(aws servicediscovery list-instances \
            --service-id "$SERVICE_ID" \
            --query 'length(Instances)' --output text)
          
          echo "   Registered instances: $INSTANCE_COUNT"
          
          if [ "$INSTANCE_COUNT" -eq 0 ]; then
            echo "⚠️  Warning: No instances registered yet"
          else
            echo "✅ Instances are registered"
          fi
      
      - name: Backend Health Check
        run: |
          echo "========================================="
          echo "BACKEND HEALTH CHECK"
          echo "========================================="
          
          API_URL="${{ steps.outputs.outputs.api_url }}"
          
          # Fallback: If API URL is not available from outputs, construct it
          if [ -z "$API_URL" ]; then
            echo "API URL not available from outputs, constructing from AWS..."
            API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='journalai-dev-http-api'].ApiId | [0]" --output text)
            if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
              API_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
              echo "Constructed API URL: $API_URL"
            else
              echo "❌ Could not determine API URL!"
              exit 1
            fi
          fi
          
          echo "API Gateway URL: $API_URL"
          echo ""
          echo "Performing health check on $API_URL/health..."
          echo ""
          
          # Perform health check with retries
          MAX_ATTEMPTS=30
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            
            # Make the health check request
            RESPONSE=$(curl -s -w "\n%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed! (Attempt $ATTEMPT/$MAX_ATTEMPTS)"
              echo ""
              echo "Response body:"
              echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
              
              # Verify the response contains expected fields
              STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo ""
                echo "✅ Backend is healthy!"
                
                # Check component statuses
                DB_STATUS=$(echo "$BODY" | jq -r '.db_url' 2>/dev/null || echo "")
                REDIS_STATUS=$(echo "$BODY" | jq -r '.redis_url' 2>/dev/null || echo "")
                
                echo "   Database URL: $DB_STATUS"
                echo "   Redis URL: $REDIS_STATUS"
                
                if [ "$DB_STATUS" = "missing" ]; then
                  echo "⚠️  Warning: Database URL not configured"
                fi
                
                if [ "$REDIS_STATUS" = "missing" ]; then
                  echo "⚠️  Warning: Redis URL not configured"
                fi
                
                SUCCESS=true
                break
              else
                echo "⚠️  Backend returned non-healthy status: $STATUS"
              fi
            else
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: HTTP $HTTP_CODE"
              
              if [ "$HTTP_CODE" = "000" ]; then
                echo "   Connection failed - service may still be starting"
              elif [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
                echo "   Gateway error - backend may still be initializing"
              elif [ "$HTTP_CODE" = "504" ]; then
                echo "   Gateway timeout - backend is not responding"
              else
                echo "   Response: $BODY"
              fi
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "   Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo ""
            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            echo ""
            echo "Debugging information:"
            echo "----------------------"
            
            # Get recent ECS task events for debugging
            echo ""
            echo "Recent ECS Service Events:"
            aws ecs describe-services \
              --cluster "${{ needs.infrastructure.outputs.ecs_cluster_name }}" \
              --services "${{ needs.infrastructure.outputs.ecs_service_name }}" \
              --query 'services[0].events[0:5].[createdAt,message]' \
              --output table
            
            exit 1
          fi
      
      - name: Summary
        if: success()
        run: |
          echo ""
          echo "========================================="
          echo "🎉 DEPLOYMENT VERIFICATION COMPLETE 🎉"
          echo "========================================="
          echo ""
          echo "✅ API Gateway: Configured and routing"
          echo "✅ VPC Link: Available and connected"
          echo "✅ ECS Tasks: Running and healthy"
          echo "✅ Service Discovery: Registered and active"
          echo "✅ Backend Health: Responding correctly"
          echo ""
          echo "API Endpoint: ${{ steps.outputs.outputs.api_url }}"
          echo ""
          echo "Deployment successful!"