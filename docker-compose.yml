services:
  postgres:
    image: postgres:15-alpine
    container_name: journalai_postgres
    environment:
      POSTGRES_USER: journalai
      POSTGRES_PASSWORD: journalai
      POSTGRES_DB: journalai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - journalai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journalai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: journalai_redis
    ports:
      - "6379:6379"
    networks:
      - journalai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journalai_backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://journalai:journalai@postgres:5432/journalai
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    networks:
      - journalai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journalai_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
      - backend
    environment:
      DATABASE_URL: postgresql://journalai:journalai@postgres:5432/journalai
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      PYTHONPATH: /app
    networks:
      - journalai_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journalai_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
      - backend
      - celery_worker
    environment:
      DATABASE_URL: postgresql://journalai:journalai@postgres:5432/journalai
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      PYTHONPATH: /app
    networks:
      - journalai_network

volumes:
  postgres_data:

networks:
  journalai_network:
    driver: bridge